/* ---------- Checker ---------- */
const ALLOWED=['pdf','doc','docx','xls','xlsx','png','jpg','jpeg'],IMG=['png','jpg','jpeg'];
const STEPS=[[2,.8],[1.5,.7],[1.2,.55],[1,.4],[.8,.3]];
const eff=s=>S.checker.b64?s*4/3:s,limB=()=>(S.checker.lim||10)*1048576;
function safeName(n){const a=S.checker.ascii,e=ext(n);let b=stem(n);
 b=a?b.normalize('NFKD').replace(/[^A-Za-z0-9._-]+/g,'_'):b.replace(/[\\/:*?"<>|\x00-\x1f]+/g,'_').replace(/\s+/g,'_');
 b=b.replace(/_+/g,'_').replace(/^[_.-]+|[_.-]+$/g,'').slice(0,Math.max(10,S.checker.maxLen-6));
 if(!b){const d=new Date(),p=x=>String(x).padStart(2,'0');b='document_'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())}
 return b+'.'+(e||'pdf')}
async function magic(f,e){const h=new Uint8Array(await f.slice(0,8).arrayBuffer());const is=(...b)=>b.every((x,i)=>h[i]===x);
 if(e==='pdf')return null;if(e==='png')return is(0x89,0x50,0x4e,0x47);if(e==='jpg'||e==='jpeg')return is(0xff,0xd8,0xff);
 if(e==='docx'||e==='xlsx')return is(0x50,0x4b);return is(0xd0,0xcf,0x11,0xe0)}
async function analyze(f){
 const c=S.checker,r=[],add=(s,t,d)=>r.push({s,t,d}),e=ext(f.name),o={r,e,review:[]};
 if(!f.name.trim()||!f.name.includes('.')||f.name.endsWith('.'))add('er','ชื่อไฟล์ว่างหรือไม่มีนามสกุล');

function aiCriteria(){
  const rows=AI_MATCH.criteriaText.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  const out=[];
  for(const row of rows){
    const m=row.match(/^(.*?)\s*[|,:：]\s*(\d+(?:\.\d+)?)\s*%?$/);
    if(!m)throw Error('รูปแบบเกณฑ์ไม่ถูกต้อง ใช้รูปแบบ ชื่อเกณฑ์ | น้ำหนัก');
    const name=m[1].trim(),weight=Number(m[2]);
    if(!name||name.length>120||!Number.isFinite(weight)||weight<=0||weight>100)throw Error('ชื่อเกณฑ์หรือน้ำหนักไม่ถูกต้อง');
    if(out.some(x=>x.name.toLowerCase()===name.toLowerCase()))throw Error('ชื่อเกณฑ์ต้องไม่ซ้ำกัน');
    out.push({name,weight});
  }
  if(out.length<1||out.length>10)throw Error('กำหนดเกณฑ์ได้ 1–10 ข้อ');
  const total=out.reduce((a,x)=>a+x.weight,0);
  if(Math.abs(total-100)>0.001)throw Error('น้ำหนักเกณฑ์รวมต้องเท่ากับ 100% (ปัจจุบัน '+total+'%)');
  return out;
}

function aiMaskIdentifiers(text){
  // Best-effort pattern masking only. Users must still review the document before sending.
  return String(text||'')
    .replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi,'[EMAIL REDACTED]')
    .replace(/\b(?:\+?66[- .]?)?(?:0?\d[- .]?){8,10}\b/g,'[PHONE REDACTED]')
    .replace(/\b\d{13}\b/g,'[ID NUMBER REDACTED]')
    .replace(/^(\s*(?:ชื่อ(?:-นามสกุล)?|name|candidate name|applicant name|วันเกิด|date of birth|อายุ|age|เพศ|gender|ที่อยู่|address|marital status|สถานภาพสมรส)\s*[:：]).*$/gim,'$1 [REDACTED]');
}

async function aiReadDocument(file, kind){
  const ext=extName(file.name);
  if(!['pdf','docx'].includes(ext))throw Error('รองรับเฉพาะ PDF และ DOCX ในรุ่นนี้');
  if(file.size===0)throw Error('ไฟล์ว่าง');
  if(file.size>(kind==='jd'?10:8)*1048576)throw Error('ไฟล์ใหญ่เกินกำหนด ('+(kind==='jd'?'10':'8')+' MB)');
  let text='';
  if(ext==='pdf'){
    const doc=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
    if(doc.numPages>30){doc.destroy();throw Error('PDF มีมากกว่า 30 หน้า กรุณาเลือกไฟล์/ช่วงเอกสารที่เกี่ยวข้อง');}
    const pages=[];
    for(let i=1;i<=doc.numPages;i++){
      const page=await doc.getPage(i),content=await page.getTextContent();
      pages.push(content.items.map(x=>x.str||'').filter(Boolean).join(' '));
    }
    doc.destroy();text=pages.join('\n');
  }else{
    const zip=await JSZip.loadAsync(file),xmlFile=zip.file('word/document.xml');
    if(!xmlFile)throw Error('ไม่พบเนื้อหา Word ในไฟล์ DOCX');
    const xml=await xmlFile.async('string'),parsed=new DOMParser().parseFromString(xml,'application/xml');
    if(parsed.querySelector('parsererror'))throw Error('อ่านโครงสร้าง DOCX ไม่สำเร็จ');
    const ns='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
    const paragraphs=Array.from(parsed.getElementsByTagNameNS(ns,'p'));
    text=paragraphs.map(p=>Array.from(p.getElementsByTagNameNS(ns,'t')).map(t=>t.textContent||'').join('')).join('\n');
  }
  text=String(text||'').replace(/\u0000/g,' ').replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();
  if(text.length<80)throw Error('อ่าน Text จากเอกสารได้น้อยมาก อาจเป็น PDF สแกน/ภาพ (รุ่นนี้ยังไม่มี OCR)');
  const max=kind==='jd'?25000:45000;
  if(text.length>max)throw Error('ข้อความยาวเกิน '+max.toLocaleString()+' ตัวอักษร กรุณาย่อเอกสารให้เหลือเฉพาะส่วนที่เกี่ยวข้อง');
  return text;
}

function aiScore(result,criteria){
  const normalized=s=>String(s||'').trim().toLowerCase();
  let earned=0,assessable=0,unknown=0;
  const items=criteria.map(c=>{
    const found=(result.criteria_assessment||[]).find(x=>normalized(x.criterion)===normalized(c.name));
    const item=found||{criterion:c.name,status:'unclear',evidence:'',cv_excerpt:'',explanation:'AI ไม่ได้ส่งผลประเมินสำหรับเกณฑ์นี้',verification_question:'กรุณาตรวจสอบด้วยตนเอง'};
    if(item.status==='unclear')unknown+=c.weight;
    else{
      assessable+=c.weight;
      earned+=c.weight*(item.status==='evidenced'?1:item.status==='partial'?.5:0);
    }
    return {...item,criterion:c.name,weight:c.weight};
  });
  return {score:assessable?Math.round(earned/assessable*100):null,coverage:Math.round(assessable),unknownWeight:Math.round(unknown),items};
}

  <details><summary>จุดแข็ง · ข้อมูลที่ยังขาด · คำถามสัมภาษณ์</summary>

}

  <div class="card"><b>3. Candidate CVs</b><p class="mt">เลือก CV หลายไฟล์ได้ในครั้งเดียว รุ่นนี้รองรับสูงสุด 15 คนต่อหนึ่ง Batch</p><label class="drop"><b>${A.cvs.length?'เลือกเพิ่ม CV (ปัจจุบัน '+A.cvs.length+' ไฟล์)':'เลือก CV PDF / DOCX หลายไฟล์'}</b><span>สูงสุด 15 ไฟล์ · PDF ไม่เกิน 8 MB ต่อไฟล์ · DOCX ไม่เกิน 8 MB</span><input type="file" multiple accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" data-ai-file="cvs"></label>${A.cvs.length?`<div>${A.cvs.map((f,i)=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--bd);padding:6px 0"><span>${String(i+1).padStart(2,'0')}. ${esc(f.name)} · ${mb(f.size)}</span><button class="btn g sm" data-ai-action="remove-cv" data-ai-index="${i}" ${A.running?'disabled':''}>ลบ</button></div>`).join('')}</div>`:''}</div>
  <div class="card"><b>4. Assessment Criteria & Weights</b><p class="mt">กำหนดเกณฑ์จาก JD และปรับน้ำหนักให้รวมเป็น 100% ตัวอย่างนี้เป็นเพียงค่าเริ่มต้น</p><textarea data-ai-field="criteriaText" rows="5" style="width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit">${esc(A.criteriaText)}</textarea><p class="mt">รูปแบบ: ชื่อเกณฑ์ | น้ำหนัก เช่น ทักษะที่จำเป็น | 35</p></div>
  <div class="card"><b>5. Privacy & Human Review</b><label style="display:flex;align-items:flex-start;margin:8px 0"><input type="checkbox" data-ai-field="anonymize" ${A.anonymize?'checked':''} style="margin:4px 8px 0 0"><span>ปกปิดอีเมล เบอร์โทร เลขประจำตัว และข้อมูลระบุตัวตนบางรูปแบบก่อนส่ง (Best-effort; ไม่รับประกันว่าปกปิดได้ทั้งหมด)</span></label><label style="display:flex;align-items:flex-start;margin:8px 0"><input type="checkbox" data-ai-field="consent" ${A.consent?'checked':''} style="margin:4px 8px 0 0"><span>ฉันยืนยันว่าได้รับอนุญาตให้ใช้ข้อมูลนี้กับ AI API ตามนโยบายองค์กรแล้ว และได้ตรวจสอบ/ลดข้อมูลส่วนบุคคลที่ไม่จำเป็นก่อนส่ง</span></label><div class="note">ห้ามใช้ AI ประเมินอายุ เพศ รูปถ่าย เชื้อชาติ ศาสนา สุขภาพ สถานภาพครอบครัว หรือคุณลักษณะส่วนบุคคลอื่น ๆ และห้ามใช้คะแนนนี้ตัดผู้สมัครออกโดยอัตโนมัติ HR ต้องตรวจหลักฐานและตัดสินใจเอง</div><div class="row"><button class="btn" data-ai-action="run" ${A.running?'disabled':''}>${A.running?'กำลังวิเคราะห์...':'Analyze '+A.cvs.length+' CVs'}</button><button class="btn g" data-ai-action="clear" ${A.running?'disabled':''}>ล้างผลวิเคราะห์</button></div>${A.running?`<div class="mt">${esc(A.progressText)} (${A.current}/${A.cvs.length})</div><div class="bar"><i style="width:${A.cvs.length?A.current/A.cvs.length*100:0}%"></i></div>`:''}</div>
  ${A.results.length?`<div class="card"><div class="top"><b>Batch Results</b><span class="pill ok">สำเร็จ ${ok} · ไม่สำเร็จ ${failed}</span></div><p class="mt">ผลเรียงตามลำดับไฟล์ต้นฉบับ ไม่ได้จัดอันดับผู้สมัคร คะแนนเป็นตัวชี้วัดหลักฐานในเอกสารเท่านั้น</p><div class="row"><button class="btn s" data-ai-action="export">Export CSV</button></div></div>${A.results.map(aiResultCard).join('')}`:''}`;
};

function extName(name){const i=String(name||'').lastIndexOf('.');return i>=0?name.slice(i+1).toLowerCase():'';}
function aiCsvCell(value){let s=String(value??'').replace(/[\r\n]+/g,' ');if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
function aiExportCsv(){
  const rows=[['Candidate','Source file','Evidence match score','Assessment coverage','Summary','Strengths','Missing information','Interview questions']];
  AI_MATCH.results.forEach((x,i)=>{if(x.error){rows.push([`Candidate ${i+1}`,x.fileName,'','','ERROR: '+x.error,'','','']);return;}const s=x.scoring,r=x.result;rows.push([`Candidate ${String(i+1).padStart(2,'0')}`,x.fileName,s.score??'',s.coverage+'%',r.candidate_summary,(r.strengths||[]).join(' | '),(r.missing_information||[]).join(' | '),(r.interview_questions||[]).join(' | ')]);});
  const csv='\uFEFF'+rows.map(r=>r.map(aiCsvCell).join(',')).join('\r\n');
  save(new Blob([csv],{type:'text/csv;charset=utf-8'}),'AI_CV_Matcher_Results.csv');
}

async function aiRunBatch(){
  const A=AI_MATCH;
  if(A.running)return;
  let criteria;
  try{criteria=aiCriteria();}catch(e){return toast(e.message);}
  if(!A.workerUrl.trim()||!/^https:\/\//i.test(A.workerUrl.trim()))return toast('กรุณากรอก Worker URL ที่เป็น HTTPS');
  if(!A.accessCode)return toast('กรุณากรอก Shared Access Code');
  if(!A.jdFile||!A.jdText)return toast('กรุณาเลือกและอ่านข้อความ JD ก่อน');
  if(!A.cvs.length)return toast('กรุณาเลือก CV อย่างน้อย 1 ไฟล์');
  if(A.cvs.length>15)return toast('รุ่นนี้รองรับไม่เกิน 15 CV ต่อ Batch');
  if(!A.consent)return toast('กรุณายืนยันสิทธิ์และการอนุมัติให้ส่งข้อมูลไปยัง AI API');
  A.running=true;A.results=[];A.current=0;A.progressText='เตรียมวิเคราะห์';R();
  try{
    for(let i=0;i<A.cvs.length;i++){
      const file=A.cvs[i];A.current=i+1;A.progressText='กำลังอ่านข้อความและวิเคราะห์ Candidate '+String(i+1).padStart(2,'0');R();
      try{
        const raw=await aiReadDocument(file,'cv');
        const cvText=A.anonymize?aiMaskIdentifiers(raw):raw;
        const response=await fetch(A.workerUrl.trim().replace(/\/+$/,'')+'/analyze',{
          method:'POST',headers:{'content-type':'application/json','X-HR-HUB-ACCESS':A.accessCode},
          body:JSON.stringify({candidateId:'Candidate '+String(i+1).padStart(2,'0'),jdText:A.jdText,cvText,criteria})
        });
        let payload={};try{payload=await response.json();}catch(_){}
        if(!response.ok)throw Error(payload.error||('Backend error '+response.status));
        const result=payload.result;
        if(!result||!Array.isArray(result.criteria_assessment))throw Error('ผลลัพธ์ AI ไม่อยู่ในรูปแบบที่รองรับ');
        A.results.push({fileName:file.name,result,scoring:aiScore(result,criteria),model:payload.model||''});
      }catch(err){A.results.push({fileName:file.name,error:err.message||'เกิดข้อผิดพลาด'});}
      A.current=i+1;R();
    }
  }finally{A.running=false;A.progressText='เสร็จสิ้น';R();}
}

document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.aiFile){const kind=t.dataset.aiFile,files=[...t.files];t.value='';if(!files.length)return;
    if(kind==='jd'){
      const f=files[0];if(!['pdf','docx'].includes(extName(f.name)))return toast('รองรับ JD PDF และ DOCX');
      AI_MATCH.jdFile=f;AI_MATCH.jdText='';AI_MATCH.results=[];R();
      try{AI_MATCH.jdText=await aiReadDocument(f,'jd');toast('อ่านข้อความ JD สำเร็จ');}catch(err){AI_MATCH.jdFile=null;toast(err.message||'อ่าน JD ไม่สำเร็จ');}
      R();
    }else{
      const valid=files.filter(f=>['pdf','docx'].includes(extName(f.name))&&f.size<=8*1048576);
      const invalid=files.length-valid.length;
      const existing=AI_MATCH.cvs;
      const merged=[...existing,...valid];
      const seen=new Set();AI_MATCH.cvs=merged.filter(f=>{const k=f.name+'|'+f.size+'|'+f.lastModified;if(seen.has(k))return false;seen.add(k);return true;}).slice(0,15);
      AI_MATCH.results=[];if(invalid)toast('ข้าม '+invalid+' ไฟล์ (ชนิดไม่รองรับหรือเกิน 8 MB)');if(merged.length>15)toast('เพิ่มได้สูงสุด 15 CV');R();
    }
  }
});
document.addEventListener('input',e=>{
  const k=e.target.dataset.aiField;if(!k)return;
  if(k==='workerUrl'||k==='accessCode'||k==='criteriaText')AI_MATCH[k]=e.target.value;
});
document.addEventListener('change',e=>{
  const k=e.target.dataset.aiField;if(!k)return;
  if(k==='anonymize'||k==='consent')AI_MATCH[k]=e.target.checked;
});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-ai-action]');if(!t)return;
  const a=t.dataset.aiAction;
  if(a==='run')aiRunBatch();
  else if(a==='clear'){if(AI_MATCH.running)return;AI_MATCH.results=[];AI_MATCH.current=0;AI_MATCH.progressText='';R();}
  else if(a==='export')aiExportCsv();
  else if(a==='remove-cv'){if(AI_MATCH.running)return;AI_MATCH.cvs.splice(Number(t.dataset.aiIndex),1);AI_MATCH.results=[];R();}
});

R();
</script>
