<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HR Document Hub — Local Document Processing</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4f2;--cd:#fff;--tx:#595959;--bd:#e5e0dd;--br:#6F5F5E;--y:#FFD400;--yt:#3a3231;--ok:#15803d;--okb:#dcfce7;--wn:#a16207;--wnb:#fef3c7;--er:#b91c1c;--erb:#fee2e2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1919;--cd:#262222;--tx:#d9d3d1;--bd:#3b3535;--br:#cbbfbd;--ok:#4ade80;--okb:#12301c;--wn:#fbbf24;--wnb:#33280a;--er:#f87171;--erb:#381414;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1919;--cd:#262222;--tx:#d9d3d1;--bd:#3b3535;--br:#cbbfbd;--ok:#4ade80;--okb:#12301c;--wn:#fbbf24;--wnb:#33280a;--er:#f87171;--erb:#381414;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Thai",Inter,system-ui,sans-serif;line-height:1.55;font-size:15px}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:var(--cd);border-right:1px solid var(--bd);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{font-weight:700;color:var(--br);font-size:17px;padding:4px 10px 12px}
.logo i{display:inline-block;width:12px;height:12px;background:var(--y);border-radius:3px;margin-right:8px}
.nav button{display:block;width:100%;text-align:left;background:none;border:0;border-left:4px solid transparent;color:var(--tx);padding:10px 12px;border-radius:0 10px 10px 0;font:inherit;cursor:pointer;min-height:44px}
.nav button:hover{background:var(--bg)}.nav button.on{border-left-color:var(--y);background:var(--bg);color:var(--br);font-weight:700}
#q{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin-bottom:10px}
#sres{margin-bottom:8px}#sres button{font-size:14px}
main{padding:28px 32px 60px;max-width:980px;width:100%}
h1{color:var(--br);font-size:26px;margin:0 0 6px;line-height:1.3}h2{color:var(--br);font-size:17px;margin:26px 0 10px}
.sub{color:var(--tx);margin:0 0 16px}.badge{display:inline-block;background:var(--y);color:var(--yt);font-weight:700;font-size:13px;padding:5px 12px;border-radius:999px;margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tool{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;text-align:left;font:inherit;color:var(--tx);cursor:pointer;min-height:84px}
.tool:hover{border-color:var(--y)}.tool b{display:block;color:var(--br)}.tool span{font-size:13px}
.tag{font-size:11px;background:var(--bg);border:1px solid var(--bd);border-radius:999px;padding:1px 8px;margin-left:6px;color:var(--tx);font-weight:400}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.drop{display:block;border:2px dashed var(--bd);border-radius:14px;background:var(--cd);text-align:center;padding:28px 12px;cursor:pointer;margin-bottom:12px}
.drop:hover,.drop.on{border-color:var(--y)}.drop b{display:block;color:var(--br);font-size:16px}.drop span{font-size:13px}.drop input{display:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row+.row{margin-top:10px}
.btn{font:inherit;font-weight:500;padding:10px 16px;border-radius:10px;border:1px solid var(--y);background:var(--y);color:var(--yt);cursor:pointer;min-height:44px}
.btn.s{background:var(--br);border-color:var(--br);color:#fff}.btn.g{background:transparent;border-color:var(--bd);color:var(--br)}.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:4px 10px;min-height:34px;font-size:13px}
button:focus-visible,input:focus-visible,select:focus-visible,.drop:focus-within{outline:3px solid var(--br);outline-offset:2px}
input[type=text],input[type=number],select{padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;min-height:40px}
input[type=number]{width:84px}
label{display:inline-flex;gap:6px;align-items:center}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.fn{word-break:break-all;font-weight:500;color:var(--br)}.mt{font-size:13px;margin-top:3px;word-break:break-word}
.pill{flex:none;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px}
.pill.ok{background:var(--okb);color:var(--ok)}.pill.wn{background:var(--wnb);color:var(--wn)}.pill.er{background:var(--erb);color:var(--er)}
details{margin-top:8px;font-size:13px}summary{cursor:pointer;color:var(--br)}
.chk{display:flex;gap:8px;padding:5px 0;border-top:1px solid var(--bd)}.chk small{display:block}.chk .t{flex:none;font-weight:700;width:16px}.chk.ok .t{color:var(--ok)}.chk.wn .t{color:var(--wn)}.chk.er .t{color:var(--er)}
.note{background:var(--wnb);color:var(--wn);border-radius:10px;padding:8px 12px;font-size:13px;margin:10px 0}
.bar{height:6px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--y);width:40%}
#msg{font-size:13px;margin:6px 0}
.pgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.pg{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:8px;text-align:center;font-size:12px}.pg.del{opacity:.35}
.pg .im{height:150px;display:flex;align-items:center;justify-content:center;overflow:hidden}.pg img{max-width:100%;max-height:140px;transition:transform .2s}
.tl{width:46px;height:46px;object-fit:cover;border-radius:6px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--br);color:#fff;padding:10px 18px;border-radius:10px;z-index:9;display:none;max-width:90vw}
@media(max-width:820px){.app{display:block}aside{position:static;height:auto;border:0;border-bottom:1px solid var(--bd)}.nav{display:flex;overflow-x:auto}.nav button{width:auto;white-space:nowrap;border-left:0;border-bottom:4px solid transparent;border-radius:10px 10px 0 0}.nav button.on{border-bottom-color:var(--y)}main{padding:18px 14px 60px}}
aside{background:#6F5F5E;border-right:0;color:#fff}.logo{color:#fff;font-size:18px}.nav button{color:#f3edec}.nav button:hover{background:rgba(255,255,255,.1)}.nav button.on{background:rgba(255,255,255,.15);color:#fff;border-left-color:var(--y)}
#q{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.28);color:#fff}#q::placeholder{color:#e6dedc}aside :focus-visible{outline-color:var(--y)}#sres .tool{background:var(--cd)}
h1{font-size:30px}.hero{padding:4px 0 12px}.h1x{font-size:40px;margin:6px 0}
.drop.big{padding:46px 16px;border:3px dashed var(--y);border-radius:18px}.drop.big b{font-size:20px}
.task{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:18px;text-align:left;font:inherit;color:var(--tx);cursor:pointer;display:flex;flex-direction:column;gap:6px}.task:hover{border-color:var(--y);box-shadow:0 0 0 2px var(--y)}
.task i{width:46px;height:46px;border-radius:12px;background:var(--y);color:var(--yt);display:flex;align-items:center;justify-content:center;margin-bottom:6px}.task b{color:var(--br);font-size:16px}.task span{font-size:13px}
</style>

<style>
.toolbox{position:relative;min-width:0}.toolbox .tool{height:100%;width:100%;padding-right:42px}
.fav-toggle{position:absolute;right:10px;top:10px;border:1px solid var(--bd);background:var(--bg);color:var(--br);border-radius:8px;min-width:30px;height:30px;font-size:18px;cursor:pointer;z-index:2}
.fav-toggle.on{background:var(--y);border-color:var(--y);color:#3a3231}
.formfield{background:rgba(255,212,0,.16);border:2px dashed #8a7100;color:#3a3231;font-size:12px;padding:2px;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center}
.formfield .x{top:-8px;right:-8px}
.it.hl{background:rgba(255,212,0,.35);border:2px solid #b38f00}
@media(max-width:820px){.fav-toggle{right:8px;top:8px}}
</style>


<style>
.tool-help{background:var(--cd);border:1px solid var(--bd);border-left:5px solid var(--y);border-radius:12px;padding:14px 16px;margin:12px 0 18px}
.tool-help .help-title{font-weight:700;color:var(--br);margin-bottom:4px}
.tool-help .help-purpose{margin:0 0 8px}
.tool-help ol{margin:6px 0 8px;padding-left:22px}
.tool-help li{margin:3px 0}
.tool-help .help-limit{font-size:13px;background:var(--wnb);color:var(--wn);padding:8px 10px;border-radius:8px;margin-top:8px}
.scanner-video-wrap{background:#171717;border-radius:14px;overflow:hidden;min-height:180px;display:flex;align-items:center;justify-content:center}
#scannerVideo{width:100%;max-height:62vh;object-fit:contain;background:#171717}
#scannerVideo[hidden]{display:none}
.scanner-preview{width:100%;max-height:62vh;object-fit:contain;background:#222;border-radius:10px}
.scan-thumb{width:78px;height:94px;object-fit:cover;border:1px solid var(--bd);border-radius:8px;background:#eee}
.scan-page{display:flex;gap:10px;align-items:center;padding:9px;border:1px solid var(--bd);border-radius:10px;margin:7px 0;background:var(--cd)}
.scan-page.selected{border:2px solid var(--y);background:var(--bg)}
.scan-page .meta{flex:1;min-width:0}
.scan-page .meta b{display:block;overflow-wrap:anywhere}
.scan-controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.scan-controls label{display:flex;flex-direction:column;align-items:flex-start;gap:4px;font-size:13px}
.scan-controls input,.scan-controls select{width:100%}
@media(max-width:820px){.tool-help{padding:12px}.scan-page{align-items:flex-start}.scan-thumb{width:64px;height:82px}}
</style>

</head>
<body>
<div class="app"><aside><div class="logo"><i></i>HR Document Hub</div><input id="q" type="search" placeholder="Search tools or document tasks..." aria-label="ค้นหาเครื่องมือ"><div id="sres"></div><nav class="nav" id="nav"></nav></aside><main id="main"></main></div>
<div id="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const mb=b=>(b/1048576).toFixed(2)+' MB',ext=n=>n.includes('.')?n.split('.').pop().toLowerCase():'',stem=n=>n.includes('.')?n.slice(0,n.lastIndexOf('.')):n;
const extName=n=>String(n||'').includes('.')?String(n).split('.').pop().toLowerCase():'';
const em=x=>x&&x.name==='PasswordException'?'PDF มีรหัสผ่าน (Phase 1 ยังไม่รองรับการปลดล็อก)':'เปิดไฟล์ไม่ได้ ไฟล์อาจเสียหาย';
function save(b,n){if(/pdf/.test(b.type||''))LAST={file:new File([b],n,{type:'application/pdf'})};const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000);toast('ดาวน์โหลดแล้ว: '+n)}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',3200)}
const setMsg=t=>{const e=$('#msg');if(e)e.textContent=t};
async function zipSave(files,name){const z=new JSZip();files.forEach(f=>z.file(f.name,f.blob||f));save(await z.generateAsync({type:'blob'}),name)}
async function openPdf(f){const b=await f.arrayBuffer();const d=await pdfjsLib.getDocument({data:new Uint8Array(b.slice(0))}).promise;return{d,b,n:d.numPages}}

const T={
checker:{n:'PDF Checker',d:'ตรวจชื่อไฟล์ ขนาด โครงสร้าง PDF แล้วแก้อัตโนมัติ',c:'chk',p:0},
img2pdf:{n:'Image to PDF',d:'รวมรูป JPG/PNG/WebP เป็น PDF',c:'conv',p:0},
merge:{n:'Merge PDF',d:'รวมหลายไฟล์ PDF เป็นไฟล์เดียว',c:'pdf',p:0},
split:{n:'Split PDF',d:'แยกตามช่วงหน้า ทีละหน้า หรือเป็นกลุ่ม',c:'pdf',p:0},
organize:{n:'Organize PDF',d:'จัดเรียง หมุน และลบหน้า',c:'pdf',p:0},
compress:{n:'Compress PDF',d:'ลดขนาดไฟล์ 3 ระดับ',c:'pdf',p:0},
word2pdf:{n:'Word to PDF',d:'แปลง DOCX เป็น PDF ผ่านเอนจิน Office ภายในเครื่อง',c:'conv',p:2},
pdf2img:{n:'PDF to Image',d:'แปลง PDF เป็น JPG/PNG',c:'conv',p:2},
repair:{n:'Repair PDF',d:'ซ่อมหรือสร้าง PDF ใหม่ (ใช้ PDF Checker แทนได้บางกรณี)',c:'pdf',p:2},
edit:{n:'Edit PDF',d:'เพิ่มข้อความ รูป และไฮไลต์แบบ overlay',c:'pdf',p:2},
watermark:{n:'Watermark / Page Numbers',d:'ใส่ลายน้ำและเลขหน้า',c:'pdf',p:2},
jd:{n:'Job Description Generator',d:'สร้าง JD PDF สำหรับส่งผู้สมัคร',c:'doc',p:3},
interview:{n:'Interview Form / Invitation',d:'ฟอร์มประเมินและจดหมายเชิญสัมภาษณ์',c:'doc',p:3},
offer:{n:'Offer Letter / Requisition',d:'เทมเพลตจดหมายเสนองานและใบขออัตรากำลัง',c:'doc',p:3},
pack:{n:'Candidate Document Pack',d:'ตอนนี้ใช้ Merge PDF รวมเอกสารผู้สมัครได้',c:'hr',p:3},
forms:{n:'Fillable PDF Forms',d:'กรอกและสร้างฟอร์ม PDF',c:'sign',p:4},
sign:{n:'Sign PDF',d:'เซ็นด้วยลายเซ็นที่วาด พิมพ์ หรืออัปโหลด',c:'sign',p:4},
redact:{n:'Redact PDF',d:'ลบข้อมูลสำคัญออกจากเนื้อหาจริง',c:'pdf',p:4},
compare:{n:'Compare PDFs',d:'เปรียบเทียบ PDF สองไฟล์',c:'pdf',p:4}
};
const CAT={pdf:'PDF Tools',conv:'File Converter',chk:'PDF Checker & Automation Prep',doc:'Document Creator',sign:'E-Signature & Forms',hr:'HR & Recruitment Tools'};
const NAV=[['home','หน้าแรก'],['cat:pdf','PDF Tools'],['cat:conv','File Converter'],['checker','PDF Checker & Automation Prep'],['cat:doc','Document Creator'],['cat:sign','E-Signature & Forms'],['cat:hr','HR & Recruitment Tools'],['settings','Settings & Privacy']];

const S={
checker:{items:[],lim:10,b64:true,ascii:true,maxLen:100,strategy:'raster',needWord:true,imgToPdf:false,busy:false,cancel:false},
img2pdf:{items:[],size:'a4',orient:'p',fit:'fit',margin:10,q:.85,mode:'one',name:'images.pdf',busy:false},
merge:{items:[],name:'merged.pdf',busy:false},
split:{file:null,n:0,mode:'ranges',ranges:'',grp:2,busy:false},
compress:{file:null,level:'balanced',res:null,busy:false},
organize:{file:null,pages:[],drag:null,name:'organized.pdf',busy:false}
};
let cur='home',arg=null;

/* ---------- shared UI ---------- */
const dz=(tool,acc,t,s)=>`<label class="drop" data-tool="${tool}"><b>${t}</b><span>${s}</span><input type="file" accept="${acc}" ${tool==='split'||tool==='compress'||tool==='organize'?'':'multiple'} data-tool="${tool}"></label>`;
const prog=()=>`<div class="bar" aria-hidden="true"><i></i></div><div id="msg"></div>`;
const sel=(k,o)=>`<select data-k="${k}">${o.map(([v,l])=>`<option value="${v}"${S[cur][k]==v?' selected':''}>${l}</option>`).join('')}</select>`;
const num=(k,min,max,st)=>`<input type="number" data-k="${k}" value="${S[cur][k]}" min="${min}" max="${max}" step="${st||1}">`;
const upDown=i=>`<button class="btn g sm" data-a="up" data-i="${i}" aria-label="เลื่อนขึ้น">↑</button><button class="btn g sm" data-a="dn" data-i="${i}" aria-label="เลื่อนลง">↓</button><button class="btn g sm" data-a="rm" data-i="${i}">ลบ</button>`;
const mv=(a,i,d)=>{const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]]};
const privacy='ไฟล์ถูกประมวลผลบนเครื่องนี้ ไม่มีการอัปโหลดเอกสารไปยังบริการภายนอก';

/* ---------- views ---------- */
function card(id){const t=T[id],fav=typeof HRDH_FAVS!=='undefined'&&HRDH_FAVS.has(id);return`<div class="toolbox"><button class="tool" data-go="${id}"><b>${t.n}${t.p?`<span class="tag">Phase ${t.p}</span>`:''}</b><span>${t.d}</span></button><button class="fav-toggle ${fav?'on':''}" data-fav-toggle="${id}" title="เพิ่ม/นำออกจากรายการโปรด" aria-label="เพิ่มหรือนำออกจากรายการโปรด">${fav?'★':'☆'}</button></div>`}
const V={
home(){const q=['merge','compress','word2pdf','checker','img2pdf','jd','sign','offer'];
return`<span class="badge">Local Document Processing | No AI API</span><h1>HR Document Hub</h1><p class="sub">พื้นที่ทำงานสำหรับเตรียมเอกสาร จัดการ PDF และงานเอกสารสรรหาบุคลากร</p>
<h2>ทางลัด</h2><div class="grid">${q.map(card).join('')}</div>
${Object.entries(CAT).map(([c,n])=>`<h2>${n}</h2><div class="grid">${Object.keys(T).filter(k=>T[k].c===c).map(card).join('')}</div>`).join('')}
<p class="mt">เครื่องมือที่มีป้าย Phase ยังไม่พร้อมใช้งาน ระบบจะแจ้งสถานะจริงเมื่อเปิดหน้านั้น</p>`},
cat(){return`<h1>${CAT[arg]}</h1><p class="sub">เลือกเครื่องมือ</p><div class="grid">${Object.keys(T).filter(k=>T[k].c===arg).map(card).join('')}</div>`},
planned(){const t=T[arg];return`<h1>${t.n}</h1><div class="card"><span class="pill wn">ยังไม่พร้อมใช้งาน · วางแผนไว้ใน Phase ${t.p}</span><p>${t.d}</p><p class="mt">ฟังก์ชันนี้ยังไม่ถูกพัฒนา จึงไม่มีปุ่มที่ใช้งานได้ ระหว่างนี้ใช้เครื่องมือ Phase 1 ในแถบซ้ายแทนได้</p><button class="btn s" data-go="home">กลับหน้าแรก</button></div>`},

const ALLOWED=['pdf','doc','docx','xls','xlsx','png','jpg','jpeg'],IMG=['png','jpg','jpeg'];
const STEPS=[[2,.8],[1.5,.7],[1.2,.55],[1,.4],[.8,.3]];
const eff=s=>S.checker.b64?s*4/3:s,limB=()=>(S.checker.lim||10)*1048576;
function safeName(n){const a=S.checker.ascii,e=ext(n);let b=stem(n);
 b=a?b.normalize('NFKD').replace(/[^A-Za-z0-9._-]+/g,'_'):b.replace(/[\\/:*?"<>|\x00-\x1f]+/g,'_').replace(/\s+/g,'_');
 b=b.replace(/_+/g,'_').replace(/^[_.-]+|[_.-]+$/g,'').slice(0,Math.max(10,S.checker.maxLen-6));
 if(!b){const d=new Date(),p=x=>String(x).padStart(2,'0');b='document_'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())}
 return b+'.'+(e||'pdf')}
async function magic(f,e){const h=new Uint8Array(await f.slice(0,8).arrayBuffer());const is=(...b)=>b.every((x,i)=>h[i]===x);
 if(e==='pdf')return null;if(e==='png')return is(0x89,0x50,0x4e,0x47);if(e==='jpg'||e==='jpeg')return is(0xff,0xd8,0xff);
 if(e==='docx'||e==='xlsx')return is(0x50,0x4b);return is(0xd0,0xcf,0x11,0xe0)}
async function analyze(f){
 const c=S.checker,r=[],add=(s,t,d)=>r.push({s,t,d}),e=ext(f.name),o={r,e,review:[]};
 if(!f.name.trim()||!f.name.includes('.')||f.name.endsWith('.'))add('er','ชื่อไฟล์ว่างหรือไม่มีนามสกุล');
 else if(!ALLOWED.includes(e))add('er','ชนิดไฟล์ .'+e+' ไม่รองรับ','รองรับ: '+ALLOWED.join(', '));
 else add('ok','ชนิดไฟล์ .'+e+' รองรับ');
 const bad=[];if(/[\\/:*?"<>|\x00-\x1f]/.test(f.name))bad.push('มีอักขระต้องห้ามหรืออักขระที่ใช้เป็นพาธ');
 else if(c.ascii&&/[^A-Za-z0-9._-]/.test(f.name))bad.push('มีอักษรไทย ช่องว่าง หรืออักขระพิเศษ');
 if(f.name.length>c.maxLen)bad.push('ชื่อยาวเกิน '+c.maxLen+' ตัวอักษร');
 bad.length?add('er','ชื่อไฟล์ไม่ผ่านกฎ',bad.join(' / ')):add('ok','ชื่อไฟล์ผ่านกฎ');
 o.nameBad=bad.length>0&&f.name.includes('.');
 const es=eff(f.size);o.sizeBad=es>limB();
 f.size===0?add('er','ไฟล์ว่าง (0 ไบต์)'):o.sizeBad?add('er','ไฟล์ใหญ่เกินลิมิต','จริง '+mb(f.size)+' / ประมาณเมื่อเข้ารหัส '+mb(es)):add('ok','ขนาดผ่าน','จริง '+mb(f.size)+' / ประมาณเมื่อเข้ารหัส '+mb(es));
 if(ALLOWED.includes(e)&&f.size>0){const m=await magic(f,e);if(m===false)add('er','เนื้อไฟล์ไม่ตรงกับนามสกุล .'+e,'ลายเซ็นไฟล์ไม่ตรง อาจเป็นไฟล์ผิดชนิดหรือเสียหาย');o.magicBad=m===false}
 if(e==='pdf'&&f.size>0&&!o.magicBad){
  const buf=await f.arrayBuffer(),head=new TextDecoder().decode(buf.slice(0,1024));
  if(!head.includes('%PDF')){add('er','โครงสร้าง PDF ผิดปกติ','ไม่พบส่วนหัว %PDF');o.pdfBad=true}
  else try{
   const pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0))}).promise;add('ok','เปิด PDF ได้ปกติ',pdf.numPages+' หน้า');o.pdf=true;
   const inf=(await pdf.getMetadata()).info||{};o.word=/microsoft/i.test((inf.Producer||'')+' '+(inf.Creator||''));
   const raw=f.size<80e6?new TextDecoder('latin1').decode(buf):'',ver=(head.match(/%PDF-(\d\.\d)/)||[])[1]||'?',fl=[];
   if(/\/Sig\b/.test(raw)){fl.push('ลายเซ็นดิจิทัล');o.signed=true}if(/\/AcroForm/.test(raw))fl.push('ฟอร์ม');
   if(/\/XFA/.test(raw)){fl.push('XFA');o.review.push('XFA')}if(/\/EmbeddedFile/.test(raw)){fl.push('ไฟล์แนบฝัง');o.review.push('ไฟล์แนบ')}
   if(/\/JavaScript|\/JS\b/.test(raw)){fl.push('JavaScript');o.review.push('JavaScript')}if(/\/Encrypt/.test(raw)){fl.push('เข้ารหัส/จำกัดสิทธิ์');o.enc=true}
   if(o.signed)o.review.push('ลายเซ็นดิจิทัล');
   add(o.word?'ok':'wn','PDF '+ver+' | Producer: '+(inf.Producer||'-')+' | Creator: '+(inf.Creator||'-'),(o.word?'metadata ระบุว่ามาจาก Microsoft (ใช้เป็นตัวบ่งชี้เท่านั้น)':'metadata ไม่ได้ระบุ Microsoft')+(fl.length?' | พบตัวบ่งชี้: '+fl.join(', '):''));
   if(o.signed)add('wn','พบตัวบ่งชี้ลายเซ็นดิจิทัล','การสร้าง PDF ใหม่จะทำให้ลายเซ็นใช้ไม่ได้');
   if(o.review.length)add('wn','ควรตรวจด้วยตนเอง',o.review.join(', '));

 }
 if(['doc','docx','xls','xlsx'].includes(e))add('wn','ไฟล์ Office ตรวจได้แค่ชื่อ ชนิด ขนาด และลายเซ็นไฟล์','ไม่ได้ตรวจเนื้อหาข้างใน');
 return o}
function plan(it){const a=it.a,c=S.checker;let m=null;
 if(a.pdf){const need=a.sizeBad||(c.needWord&&!a.word);
  if(need&&c.strategy!=='rename')m=a.sizeBad&&c.strategy==='clean'?'clean':(a.sizeBad?'raster':c.strategy);
  else if(a.nameBad)m='name'}
 else if(IMG.includes(a.e)&&!a.magicBad&&(a.sizeBad||c.imgToPdf))m='raster';
 else if(a.nameBad&&ALLOWED.includes(a.e)&&!a.magicBad)m='name';
 it.mode=m;it.state=m?'fix':a.r.some(x=>x.s==='er')?'er':a.review.length?'review':'ok'}
function assign(){const used=new Set();S.checker.items.forEach(it=>{if(!it.a)return;
 let n=it.manual||(it.mode?safeName(it.file.name):it.file.name);if(!it.manual&&(it.mode==='raster'||it.mode==='clean'))n=stem(n)+'.pdf';
 const b=n;let i=2,d=false;while(used.has(n.toLowerCase())){n=stem(b)+'_'+i+(ext(b)?'.'+ext(b):'');i++;d=true}
 used.add(n.toLowerCase());it.name=n;it.dup=d;if(d&&!it.mode&&(it.state==='ok'||it.state==='review')){it.mode='name';it.state='fix'}})}
async function raster(buf,scale,q,cb){const pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0))}).promise;let doc;
 for(let i=1;i<=pdf.numPages;i++){if(S.checker.cancel&&cb)throw Error('ยกเลิกแล้ว');cb&&cb('หน้า '+i+'/'+pdf.numPages);
  const p=await pdf.getPage(i),v1=p.getViewport({scale:1}),v=p.getViewport({scale}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);await p.render({canvasContext:x,viewport:v}).promise;
  const o=v1.width>v1.height?'l':'p';if(i===1)doc=new jspdf.jsPDF({unit:'pt',format:[v1.width,v1.height],orientation:o});else doc.addPage([v1.width,v1.height],o);

 return doc.output('blob')}

async function fixOne(it){const C=S.checker;it.busy=true;it.msg='';it.note='';R();
 try{let blob=it.file;const a=it.a,pr=t=>{it.prog=t;setMsg(t)};
  if(it.mode==='clean'){const src=await PDFLib.PDFDocument.load(await it.file.arrayBuffer(),{ignoreEncryption:true}),out=await PDFLib.PDFDocument.create();
   (await out.copyPages(src,src.getPageIndices())).forEach(p=>out.addPage(p));out.setProducer('');out.setCreator('');blob=new Blob([await out.save()],{type:'application/pdf'});

async function buildImgPdf(list,o,single){let doc=null;const L=o.fit,mmt=2.835;
 for(const it of list){const im=new Image();await new Promise((res,rej)=>{im.onload=res;im.onerror=()=>rej(Error('เปิดรูปไม่ได้: '+(it.file?it.file.name:'')));im.src=it.url});
  let pw,ph,m;if(o.size==='orig'){pw=im.width*.75;ph=im.height*.75;m=0}else{[pw,ph]=o.size==='a4'?[595.28,841.89]:[612,792];if(o.orient==='l')[pw,ph]=[ph,pw];m=o.margin*mmt}

function parseRanges(s,n){const out=[];for(const p of s.split(',').map(x=>x.trim()).filter(Boolean)){const m=p.match(/^(\d+)(?:\s*-\s*(\d+))?$/);if(!m)throw Error('รูปแบบไม่ถูกต้อง: "'+p+'"');const a=+m[1],b=m[2]?+m[2]:a;if(a<1||b>n||a>b)throw Error('ช่วง "'+p+'" อยู่นอก 1–'+n);out.push([a,b])}if(!out.length)throw Error('กรุณาระบุช่วงหน้า');return out}

function localNormalize(s){ return String(s||'').toLowerCase().normalize('NFKC').replace(/[\u200b-\u200f\ufeff]/g,'').replace(/\s+/g,' ').trim(); }
function localContains(text, term){
  const t=localNormalize(term), h=localNormalize(text);
  if(!t) return false;
  if(/^[a-z0-9][a-z0-9 +.#/-]*$/i.test(t)){
    const escaped=t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'\\s+');
    return new RegExp('(^|[^a-z0-9])'+escaped+'($|[^a-z0-9])','i').test(h);
  }
  return h.includes(t);
}
function localCriteria(){
  const rows=AI_MATCH.criteriaText.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),out=[];
  for(const row of rows){
    const parts=row.split('|').map(x=>x.trim());
    if(parts.length<3) throw Error('รูปแบบเกณฑ์ไม่ถูกต้อง ใช้ ชื่อเกณฑ์ | น้ำหนัก | คำค้น/คำพ้อง');
    const [name,w,termsRaw]=parts,weight=Number(w),terms=[...new Set(termsRaw.split(/[,;；、]/).map(x=>x.trim()).filter(Boolean))];
    if(!name||name.length>100||!Number.isFinite(weight)||weight<=0||weight>100||!terms.length) throw Error('ชื่อเกณฑ์ น้ำหนัก หรือคำค้นไม่ถูกต้อง: '+name);
    if(out.some(x=>x.name.toLowerCase()===name.toLowerCase())) throw Error('ชื่อเกณฑ์ต้องไม่ซ้ำกัน: '+name);
    out.push({name,weight,terms});
  }
  if(!out.length||out.length>10) throw Error('กำหนดเกณฑ์ได้ 1–10 ข้อ');
  const total=out.reduce((a,x)=>a+x.weight,0);
  if(Math.abs(total-100)>0.001) throw Error('น้ำหนักเกณฑ์รวมต้องเท่ากับ 100% (ปัจจุบัน '+total+'%)');
  return out;
}
async function localReadDocument(file,kind){
  const ext=extName(file.name);
  if(!['pdf','docx','txt'].includes(ext)) throw Error('รองรับ PDF, DOCX และ TXT');
  if(!file.size) throw Error('ไฟล์ว่าง');
  const max=(kind==='jd'?10:8)*1048576;
  if(file.size>max) throw Error('ไฟล์ใหญ่เกิน '+(kind==='jd'?10:8)+' MB');
  let text='';
  if(ext==='pdf'){
    const doc=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
    if(doc.numPages>40){doc.destroy();throw Error('PDF มากกว่า 40 หน้า กรุณาแยกไฟล์ก่อน');}
    const pages=[];
    for(let n=1;n<=doc.numPages;n++){
      const page=await doc.getPage(n),content=await page.getTextContent();
      pages.push(content.items.map(x=>x.str||'').filter(Boolean).join(' '));
    }
    doc.destroy(); text=pages.join('\n');
  } else if(ext==='docx'){
    const zip=await JSZip.loadAsync(file),xmlFile=zip.file('word/document.xml');
    if(!xmlFile) throw Error('ไม่พบเนื้อหา Word ในไฟล์ DOCX');
    const xml=await xmlFile.async('string'),parsed=new DOMParser().parseFromString(xml,'application/xml');
    if(parsed.querySelector('parsererror')) throw Error('อ่านโครงสร้าง DOCX ไม่สำเร็จ');
    const ns='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
    text=Array.from(parsed.getElementsByTagNameNS(ns,'p')).map(p=>Array.from(p.getElementsByTagNameNS(ns,'t')).map(t=>t.textContent||'').join('')).join('\n');
  } else text=await file.text();
  text=String(text||'').replace(/\u0000/g,' ').replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();
  if(text.length<30) throw Error('อ่านข้อความได้น้อยมาก อาจเป็น PDF สแกน ให้ใช้ OCR PDF to Text ก่อน');
  const maxChars=kind==='jd'?30000:50000;
  if(text.length>maxChars) throw Error('ข้อความยาวเกิน '+maxChars.toLocaleString()+' ตัวอักษร กรุณาเลือกเอกสารที่สั้นลง');
  return text;
}
function localEvidenceExcerpt(text,term){
  const raw=String(text||''),needle=String(term||'');
  let idx=raw.toLowerCase().indexOf(needle.toLowerCase());
  if(idx<0){const normalized=localNormalize(raw),t=localNormalize(needle);idx=normalized.indexOf(t);if(idx<0)return '';return normalized.slice(Math.max(0,idx-100),Math.min(normalized.length,idx+t.length+180)).trim();}
  const start=Math.max(0,idx-100),end=Math.min(raw.length,idx+needle.length+180);
  return raw.slice(start,end).replace(/\s+/g,' ').trim();
}
function localMatchOne(fileName,text,criteria,index){
  const rows=criteria.map(c=>{
    const matched=c.terms.filter(term=>localContains(text,term));
    const ratio=matched.length/c.terms.length;
    const status=ratio>=0.6?'evidenced':ratio>0?'partial':'not_stated';
    const excerpt=matched.length?localEvidenceExcerpt(text,matched[0]):'';
    return {...c,matched,status,ratio,excerpt};
  });
  const score=Math.round(rows.reduce((sum,r)=>sum+r.weight*r.ratio,0));
  const allTerms=criteria.flatMap(c=>c.terms),hits=allTerms.filter(t=>localContains(text,t));
  const summaries=rows.filter(r=>r.matched.length).slice(0,3).map(r=>r.name+': '+r.matched.join(', '));
  const summary='Local keyword scan พบคำค้นที่ตรงกัน '+hits.length+' จาก '+allTerms.length+' คำ ('+rows.length+' เกณฑ์)'+(summaries.length?' โดยพบหลักฐานที่เกี่ยวข้องกับ '+summaries.join(' · '):' ยังไม่พบคำค้นที่กำหนดในเอกสาร');
  const strengths=rows.filter(r=>r.status==='evidenced').map(r=>r.name+' — พบคำ/วลี: '+r.matched.join(', '));
  const partial=rows.filter(r=>r.status==='partial').map(r=>r.name+' — พบเพียงบางคำ: '+r.matched.join(', '));
  const missing=rows.filter(r=>r.status==='not_stated').map(r=>r.name+' — ไม่พบคำค้นที่กำหนดใน CV (ไม่ได้แปลว่าผู้สมัครไม่มีทักษะนี้)');
  const questions=rows.filter(r=>r.status!=='evidenced').map(r=>r.status==='partial'?'ช่วยอธิบายเพิ่มเติมเกี่ยวกับ '+r.name+' และยกตัวอย่างผลงานที่เกี่ยวข้องได้หรือไม่?':'ช่วยเล่าประสบการณ์หรือหลักฐานที่เกี่ยวข้องกับ '+r.name+' เพิ่มเติมได้หรือไม่?');
  return {fileName,candidate:'Candidate '+String(index+1).padStart(2,'0'),score,coverage:100,summary,rows,strengths,partial,missing,questions,method:'Rule-based keyword matching'};
}

async function localRunBatch(){
  const A=AI_MATCH;if(A.running)return;

  if(!A.jdFile||!A.jdText)return toast('กรุณาเลือก JD และอ่านข้อความก่อน');
  if(!A.cvs.length)return toast('กรุณาเลือก CV อย่างน้อย 1 ไฟล์');
  A.running=true;A.results=[];A.current=0;R();
  try{
    for(let i=0;i<A.cvs.length;i++){
      const f=A.cvs[i];A.current=i+1;A.progressText='กำลังอ่านข้อความ Candidate '+String(i+1).padStart(2,'0');R();

async function loadTesseract(){if(window.Tesseract)return;await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js';s.onload=resolve;s.onerror=()=>reject(Error('โหลด OCR Engine ไม่สำเร็จ ตรวจสอบการเชื่อมต่อ CDN'));document.head.appendChild(s);});}
ADD.ocr=fs=>{const f=pdfOnly(fs)[0];if(!f)return;if(f.size>15*1048576)return toast('ไฟล์ใหญ่เกิน 15 MB');S.ocr.file=f;S.ocr.text='';S.ocr.progress='';R();};
A.ocr={clr(){S.ocr.file=null;S.ocr.text='';S.ocr.progress='';R();},txt(){const C=S.ocr;save(new Blob([C.text],{type:'text/plain;charset=utf-8'}),stem(C.file.name)+'_OCR.txt');},copy(){const C=S.ocr;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(C.text).then(()=>toast('คัดลอกข้อความแล้ว')).catch(()=>toast('คัดลอกไม่สำเร็จ'));else toast('เบราว์เซอร์นี้ไม่รองรับ Clipboard API')},async go(){
  const C=S.ocr;await run(C,async()=>{if(!C.file)throw Error('กรุณาเลือก PDF');await loadTesseract();const pdf=await openPdf(C.file);if(pdf.n>10){pdf.d.destroy();throw Error('OCR รุ่นนี้จำกัดไม่เกิน 10 หน้า');}
    const langs=C.lang.split('+');let worker=null;const results=[];
    try{worker=await Tesseract.createWorker(langs,1,{logger:m=>{if(m.status)C.progress=m.status+(m.progress!==undefined?' '+Math.round(m.progress*100)+'%':'');}});
      for(let n=1;n<=pdf.n;n++){C.progress='กำลัง OCR หน้า '+n+'/'+pdf.n;R();setMsg('OCR หน้า '+n+'/'+pdf.n);const page=await pdf.d.getPage(n),baseVp=page.getViewport({scale:1}),scale=Math.min(1.6,2400/Math.max(baseVp.width,baseVp.height)),vp=page.getViewport({scale}),canvas=document.createElement('canvas');canvas.width=vp.width;canvas.height=vp.height;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);await page.render({canvasContext:ctx,viewport:vp}).promise;const result=await worker.recognize(canvas);results.push('--- Page '+n+' ---\n'+String(result.data.text||'').trim());canvas.width=canvas.height=0;R();}
      C.text=results.join('\n\n').trim();if(!C.text)throw Error('OCR ไม่พบข้อความในเอกสาร');
    } finally {if(worker)await worker.terminate();pdf.d.destroy();}
  });}};

ADD.pdf2word=async fs=>{const f=pdfOnly(fs)[0];if(!f)return;const C=S.pdf2word;C.file=f;C.text='';C.pages=0;try{const r=await lines(f);C.text=r.L.join('\n');C.pages=r.n;if(C.text.length<30)throw Error('ไม่พบ Text Layer ใน PDF ใช้ OCR PDF to Text ก่อน');}catch(e){C.file=null;toast(e.message||'อ่านข้อความ PDF ไม่สำเร็จ');}R();};
function xmlEscape(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');}
async function makeTextDocx(text){
  const z=new JSZip(),paras=String(text||'').replace(/\r/g,'').split('\n').map(line=>`<w:p><w:r><w:t xml:space="preserve">${xmlEscape(line)}</w:t></w:r></w:p>`).join('');
  z.file('[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
  z.folder('_rels').file('.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  z.folder('word').file('document.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${paras}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134"/></w:sectPr></w:body></w:document>`);
  return z.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}

ADD.html2pdf=async fs=>{const f=fs[0];if(!f||!['html','htm'].includes(extName(f.name)))return toast('เลือกไฟล์ HTML');if(f.size>2*1048576)return toast('HTML ใหญ่เกิน 2 MB');S.html2pdf.file=f;S.html2pdf.html=await f.text();R();};
function sanitizePrintHtml(raw){
  const doc=new DOMParser().parseFromString(String(raw||''),'text/html');
  doc.querySelectorAll('script,style,link,meta,base,iframe,object,embed,svg,math,video,audio,form,input,button,canvas,img,source').forEach(x=>x.remove());
  const allowed=new Set(['H1','H2','H3','H4','H5','H6','P','BR','UL','OL','LI','TABLE','THEAD','TBODY','TFOOT','TR','TH','TD','STRONG','B','EM','I','U','HR','BLOCKQUOTE','DIV','SPAN','PRE','CODE']);
  [...doc.body.querySelectorAll('*')].reverse().forEach(el=>{if(!allowed.has(el.tagName)){el.replaceWith(...el.childNodes);return;}[...el.attributes].forEach(a=>el.removeAttribute(a.name));});
  return doc.body.innerHTML;
}
A.html2pdf={reset(){S.html2pdf.html='<h1>หัวข้อเอกสาร</h1>\n<p>พิมพ์หรือวางเนื้อหา HTML ที่นี่</p>';S.html2pdf.file=null;R();},print(){const safe=sanitizePrintHtml(S.html2pdf.html);if(!safe.trim())return toast('ไม่มีเนื้อหา HTML');const w=window.open('','_blank');if(!w)return toast('Browser บล็อก Pop-up กรุณาอนุญาต Pop-up ให้เว็บไซต์นี้');w.document.open();w.document.write(`<!doctype html><html lang="th"><head><meta charset="utf-8"><title>HTML to PDF</title><style>body{font-family:Arial,sans-serif;color:#222;margin:18mm;line-height:1.55}h1,h2,h3{color:#6F5F5E}table{border-collapse:collapse;width:100%}td,th{border:1px solid #aaa;padding:6px;text-align:left}blockquote{border-left:4px solid #FFD400;padding-left:12px;color:#555}pre{white-space:pre-wrap} @page{size:A4;margin:18mm}</style></head><body>${safe}</body></html>`);w.document.close();w.focus();setTimeout(()=>w.print(),350);}};

function otsuLevel(hist,total){
  let sum=0;for(let i=0;i<256;i++)sum+=i*hist[i];
  let sumB=0,wB=0,max=0,threshold=170;
  for(let i=0;i<256;i++){wB+=hist[i];if(!wB)continue;const wF=total-wB;if(!wF)break;sumB+=i*hist[i];const mB=sumB/wB,mF=(sum-sumB)/wF,between=wB*wF*(mB-mF)*(mB-mF);if(between>max){max=between;threshold=i;}}
  return threshold;
}

  const ctx=canvas.getContext('2d');ctx.translate(canvas.width/2,canvas.height/2);ctx.rotate(rot*Math.PI/180);ctx.drawImage(crop,-cw/2,-ch/2);
  const filter=page.filter||'clean';
  if(filter!=='original'){
    const image=ctx.getImageData(0,0,canvas.width,canvas.height),d=image.data,hist=new Uint32Array(256),len=d.length/4;
    for(let i=0;i<d.length;i+=4){const y=Math.max(0,Math.min(255,Math.round(.299*d[i]+.587*d[i+1]+.114*d[i+2])));hist[y]++;}
    const otsu=otsuLevel(hist,len);
    let threshold=otsu;
    if(filter==='clean')threshold=Math.min(225,Math.max(155,otsu+8));
    if(filter==='photocopy')threshold=Math.min(220,Math.max(175,otsu+18));
    for(let i=0;i<d.length;i+=4){
      let r=d[i],g=d[i+1],b=d[i+2],gray=.299*r+.587*g+.114*b;
      if(filter==='gray'||filter==='soft'){
        const contrast=filter==='soft'?1.12:1.04,bright=filter==='soft'?7:0;gray=Math.max(0,Math.min(255,(gray-128)*contrast+128+bright));r=g=b=gray;
      }else if(filter==='bw'||filter==='clean'||filter==='photocopy'){
        const v=gray>=threshold?255:0;r=g=b=v;
      }else if(filter==='enhance'){
        const avg=(r+g+b)/3,contrast=1.12,sat=1.16;
        r=Math.max(0,Math.min(255,((avg+(r-avg)*sat)-128)*contrast+132));
        g=Math.max(0,Math.min(255,((avg+(g-avg)*sat)-128)*contrast+132));
        b=Math.max(0,Math.min(255,((avg+(b-avg)*sat)-128)*contrast+132));
      }
      d[i]=r;d[i+1]=g;d[i+2]=b;
    }
    ctx.putImageData(image,0,0);
  }
  const q=page.quality==='small'?.70:page.quality==='standard'?.84:.92;
  const url=canvas.toDataURL('image/jpeg',q);crop.width=crop.height=canvas.width=canvas.height=0;return url;
}
async function refreshScannerPreview(){
  const C=S.scanner,p=C.pages[C.selected];if(!p){C.previewUrl='';return;}
  try{C.previewUrl=await processScanPage(p,1500);}catch(e){C.previewUrl=p.dataUrl;toast(e.message||'สร้างภาพตัวอย่างไม่สำเร็จ');}
}
function scanPageFromData(dataUrl,name){
  const C=S.scanner;if(C.pages.length>=20)throw Error('รุ่นนี้รองรับไม่เกิน 20 หน้า');
  C.pages.push({dataUrl,name:name||'Page '+(C.pages.length+1),filter:C.defaultFilter,quality:C.quality,rotate:0,cropTop:0,cropRight:0,cropBottom:0,cropLeft:0});
  C.selected=C.pages.length-1;
}

  ${C.pages.length?`<div class="card"><div class="top"><b>หน้าที่ถ่ายไว้ (${C.pages.length})</b><span class="mt">สูงสุด 20 หน้า</span></div>${C.pages.map((x,i)=>`<div class="scan-page ${i===C.selected?'selected':''}"><img class="scan-thumb" src="${x.dataUrl}" alt="หน้า ${i+1}"><div class="meta"><b>หน้า ${i+1}</b><span class="mt">${esc(x.name)} · ${esc(x.filter)}</span><div class="row"><button class="btn g sm" data-a="select" data-i="${i}">เลือก</button><button class="btn g sm" data-a="up" data-i="${i}" ${i===0?'disabled':''}>↑</button><button class="btn g sm" data-a="dn" data-i="${i===C.pages.length-1?'disabled':''}>↓</button><button class="btn g sm" data-a="remove" data-i="${i}">ลบ</button></div></div></div>`).join('')}<div class="row"><label>ชื่อไฟล์ PDF <input type="text" data-k="name" value="${esc(C.name)}"></label><button class="btn s" data-a="create" ${C.busy?'disabled':''}>สร้าง PDF (${C.pages.length} หน้า)</button><button class="btn g" data-a="clear" ${C.busy?'disabled':''}>ล้างทุกหน้า</button></div>${C.busy?prog():''}</div>`:''}`;

ADD.scanner=async files=>{
  const C=S.scanner,valid=[...files].filter(f=>/^image\/(jpeg|png|webp)$/.test(f.type)&&f.size<=10*1048576);if(valid.length!==files.length)toast('รองรับ JPG/PNG/WebP ขนาดไม่เกิน 10 MB ต่อรูป');
  for(const f of valid){if(C.pages.length>=20){toast('เพิ่มได้สูงสุด 20 หน้า');break;}const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('อ่านไฟล์รูปไม่สำเร็จ'));r.readAsDataURL(f);});try{scanPageFromData(data,f.name);}catch(e){toast(e.message);break;}}
  await refreshScannerPreview();R();
};
A.scanner={
  async start(){const C=S.scanner;if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia)return toast('กล้องต้องใช้ HTTPS และ Browser ที่รองรับ getUserMedia');try{stopScannerStream(false);const stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:C.facing},width:{ideal:1920},height:{ideal:1080}}});C.stream=stream;C.cameraOn=true;R();syncScannerVideo();toast('เปิดกล้องแล้ว กรุณาจัดเอกสารให้อยู่ในกรอบภาพ');}catch(e){toast('เปิดกล้องไม่ได้: '+(e.name==='NotAllowedError'?'กรุณาอนุญาตสิทธิ์กล้อง':e.message||e.name));}},
  stop(){stopScannerStream(true);},
  async switch(){const C=S.scanner;C.facing=C.facing==='environment'?'user':'environment';await A.scanner.start();},
  capture(){const C=S.scanner,v=$('#scannerVideo');if(!C.stream||!v||!v.videoWidth)return toast('กล้องยังไม่พร้อม กรุณารอสักครู่');const scale=Math.min(1,2500/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement('canvas');c.width=Math.round(v.videoWidth*scale);c.height=Math.round(v.videoHeight*scale);const x=c.getContext('2d');x.drawImage(v,0,0,c.width,c.height);try{scanPageFromData(c.toDataURL('image/jpeg',.95),'Camera_'+String(C.pages.length+1).padStart(2,'0'));}catch(e){toast(e.message);return;}c.width=c.height=0;refreshScannerPreview().then(()=>R());toast('เพิ่มหน้าเอกสารแล้ว');},
  select(t){S.scanner.selected=Number(t.dataset.i);refreshScannerPreview().then(()=>R());},
  up(t){const C=S.scanner,i=Number(t.dataset.i);if(i>0){[C.pages[i-1],C.pages[i]]=[C.pages[i],C.pages[i-1]];C.selected=i-1;refreshScannerPreview().then(()=>R());}},
  dn(t){const C=S.scanner,i=Number(t.dataset.i);if(i<C.pages.length-1){[C.pages[i+1],C.pages[i]]=[C.pages[i],C.pages[i+1]];C.selected=i+1;refreshScannerPreview().then(()=>R());}},
  remove(t){const C=S.scanner,i=Number(t.dataset.i);C.pages.splice(i,1);C.selected=Math.max(0,Math.min(C.selected,C.pages.length-1));refreshScannerPreview().then(()=>R());},
  rotate(){const C=S.scanner,p=C.pages[C.selected];if(!p)return;p.rotate=(p.rotate+90)%360;refreshScannerPreview().then(()=>R());},
  preview(){refreshScannerPreview().then(()=>{R();toast('อัปเดตตัวอย่างแล้ว');});},
  clear(){const C=S.scanner;stopScannerStream(false);C.pages=[];C.selected=0;C.previewUrl='';R();},
  async create(){const C=S.scanner;if(!C.pages.length)return toast('กรุณาถ่ายหรือเลือกรูปอย่างน้อย 1 หน้า');await run(C,async()=>{let doc=null;for(let i=0;i<C.pages.length;i++){setMsg('กำลังประมวลผลหน้า '+(i+1)+'/'+C.pages.length);const data=await processScanPage(C.pages[i],2400),im=await loadScanImage(data),land=im.width>im.height,format=C.pageSize==='letter'?'letter':'a4',orient=land?'landscape':'portrait';if(!doc)doc=new jspdf.jsPDF({unit:'mm',format,orientation:orient,compress:true});else doc.addPage(format,orient);const pw=doc.internal.pageSize.getWidth(),ph=doc.internal.pageSize.getHeight(),margin=5,scale=Math.min((pw-margin*2)/im.width,(ph-margin*2)/im.height),w=im.width*scale,h=im.height*scale;doc.addImage(data,'JPEG',(pw-w)/2,(ph-h)/2,w,h,undefined,'FAST');}
    const name=(C.name||'scanned_document.pdf').trim().replace(/[\\/:*?"<>|\x00-\x1f]/g,'_');save(doc.output('blob'),/\.pdf$/i.test(name)?name:name+'.pdf');});}
};
document.addEventListener('change',async e=>{
  const t=e.target;if(cur!=='scanner')return;
  if(t.dataset.k==='quality'){S.scanner.pages.forEach(p=>p.quality=t.value);await refreshScannerPreview();R();return;}
  if(t.dataset.scanField){const p=S.scanner.pages[S.scanner.selected];if(!p)return;const k=t.dataset.scanField;let v=t.type==='number'?Math.max(0,Math.min(40,Number(t.value)||0)):t.value;p[k]=v;await refreshScannerPreview();R();}
});
